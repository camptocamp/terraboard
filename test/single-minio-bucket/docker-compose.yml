---
version: "3.8"
services:
  terraboard-dev:
    build:
      context: ../../
      dockerfile: ./Dockerfile
    environment:
      AWS_ACCESS_KEY_ID: root
      AWS_SECRET_ACCESS_KEY: mypassword
      AWS_BUCKET: test-bucket
      AWS_REGION: eu-west-1
      AWS_ENDPOINT: http://minio:9000/
      AWS_FORCE_PATH_STYLE: "true"
      TERRABOARD_LOG_LEVEL: debug
      TERRABOARD_NO_LOCKS: "true"
      TERRABOARD_NO_VERSIONING: "true"
      DB_PASSWORD: mypassword
      DB_SSLMODE: disable
      GODEBUG: netdns=go
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "8081:8081"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: mypassword
    expose:
      - "9000"
    ports:
      - "9200:9000"
    volumes:
      - minio-data:/data
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO's erasure-coded storage format requires objects to be written
  # through the S3 API (they need xl.meta sidecar files), so the .tfstate
  # fixtures can't just be bind-mounted into /data anymore. This uploads
  # them via `mc` once MinIO is up.
  minio-init:
    image: minio/minio:latest
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 root mypassword &&
      (mc mb -p local/test-bucket || true) &&
      mc cp --recursive /seed/test-bucket/ local/test-bucket/
      "
    volumes:
      - ../data/minio-1:/seed:ro
    depends_on:
      minio:
        condition: service_healthy

  db:
    image: postgres:9.5
    environment:
      POSTGRES_USER: gorm
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: gorm
    volumes:
      - tb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorm"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"

volumes:
  tb-data: {}
  minio-data: {}
