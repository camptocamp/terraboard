---
version: "3.8"
services:
  terraboard-dev:
    build:
      context: ../../
      dockerfile: ./Dockerfile
    environment:
      DB_SSLMODE: disable
      CONFIG_FILE: config/config.yml
      GODEBUG: netdns=go
      AWS_ACCESS_KEY_ID: root
      AWS_SECRET_ACCESS_KEY: mypassword
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./config.yml:/config/config.yml:ro
    ports:
      - "8080:8080"
      - "8081:8081"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: mypassword
    expose:
      - "9000"
    ports:
      - "9200:9000"
    volumes:
      - minio-data-1:/data
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-2:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    expose:
      - "9000"
    ports:
      - "9300:9000"
    volumes:
      - minio-data-2:/data
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO's erasure-coded storage format requires objects to be written
  # through the S3 API (they need xl.meta sidecar files), so the .tfstate
  # fixtures can't just be bind-mounted into /data anymore. This uploads
  # them via `mc` once both MinIO instances are up.
  minio-init:
    image: minio/minio:latest
    entrypoint: >
      /bin/sh -c "
      mc alias set local1 http://minio:9000 root mypassword &&
      (mc mb -p local1/test-bucket || true) &&
      (mc mb -p local1/test-bucket2 || true) &&
      mc cp --recursive /seed/minio-1/test-bucket/ local1/test-bucket/ &&
      mc alias set local2 http://minio-2:9000 admin password &&
      (mc mb -p local2/test-bucket || true) &&
      mc cp --recursive /seed/minio-2/test-bucket/ local2/test-bucket/
      "
    volumes:
      - ../data/minio-1:/seed/minio-1:ro
      - ../data/minio-2:/seed/minio-2:ro
    depends_on:
      minio:
        condition: service_healthy
      minio-2:
        condition: service_healthy

  db:
    image: postgres:9.5
    environment:
      POSTGRES_USER: gorm
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: gorm
    volumes:
      - tb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorm"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"

volumes:
  tb-data: {}
  minio-data-1: {}
  minio-data-2: {}
